<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Buffer Overflow</title>
	<style>
		/* 🛠️ 1. BASE CANVAS STYLING & SLEEK BLACK BACKGROUND */
		body {
			margin: 0;
			padding: 0;
			background-color: #0d0d11; /* Sleek dark-grid background */
			color: #ffffff;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			position: absolute;
			top: 0;
			left: 0;
			z-index: 1;
		}

		#canvas:focus {
			outline: none;
		}

		/* 🛠️ 2. CUSTOM LOADING OVERLAY CONTAINER */
		#loading-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: #09090b; /* Pure velvet black boot overlay */
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 10;
			transition: opacity 0.4s ease-out;
		}

		/* 🛠️ 3. LOADING TRACKER WITH PROGRESS-TRACKING GIF */
		.loader-wrapper {
			position: relative;
			width: 280px; /* Width matching the progress layout bar */
			display: flex;
			flex-direction: column;
			align-items: flex-start;
		}

		/* THE PROGRESS GIF CONTAINER */
		#loading-gif {
			width: 32px;  /* Adjust size based on your specific GIF dimensions */
			height: 38px;
			position: absolute;
			bottom: 32px; /* Sits cleanly on top of the loading bar */
			left: 0%;    /* Modified live via JavaScript script below */
			transform: translateX(-50%); /* Centers the asset exactly on the progress line */
			image-rendering: pixelated; /* Keeps pixel-art loops super crisp */
			pointer-events: none;
		}

		/* THE SLEEK CUSTOM METRIC PROGRESS BAR */
		progress {
			-webkit-appearance: none;
			appearance: none;
			width: 100%;
			height: 6px; /* Thin, minimalist profile bar design */
			border: none;
			background-color: #1c1c24; /* Loading bar track gutter background */
			border-radius: 10px;
			overflow: visible; /* Allows the runner indicator boundary logic to pass */
		}

		/* Color detailing for modern browsers (Chrome, Edge, Safari, Opera) */
		progress::-webkit-progress-bar {
			background-color: #1c1c24;
			border-radius: 10px;
		}
		progress::-webkit-progress-value {
			background-color: #ff4a4a; /* Sleek arcade accent tracking line (Neon Red) */
			border-radius: 10px;
			transition: width 0.1s ease-out;
		}

		/* Color detailing for Firefox */
		progress::-moz-progress-bar {
			background-color: #ff4a4a;
			border-radius: 10px;
		}

		#loading-text {
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: 0.15em;
			color: #636370;
			margin-top: 12px;
			align-self: center;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">HTML5 canvas interface support is required to run this execution application.</canvas>

	<div id="loading-container">
		<div class="loader-wrapper">
			<img id="loading-gif" src="loading_runner.gif" alt="Loading..." />
			
			<progress id="progress" value="0" max="100"></progress>
			
			<div id="loading-text">Initializing Engine...</div>
		</div>
	</div>

	<script>
	// 🟢 The modern safe initialization block for Godot 4
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4791920,"index.wasm":35754592},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const engine = new Engine(GODOT_CONFIG); // Changed 'Godot' to 'Engine'

	const loadingContainer = document.getElementById('loading-container');
	const progressBar = document.getElementById('progress');
	const loadingText = document.getElementById('loading-text');
	const loadingGif = document.getElementById('loading-gif');

	engine.startGame({
		'onProgress': function (current, total) {
			if (total > 0) {
				const percentage = (current / total) * 100;
				progressBar.value = percentage;
				loadingText.innerText = `Downloading Data: ${Math.floor(percentage)}%`;
				
				if (loadingGif) {
					loadingGif.style.left = `${percentage}%`;
				}
			} else {
				loadingText.innerText = "Processing system segments...";
			}
		}
	}).then(() => {
		loadingContainer.style.opacity = '0';
		setTimeout(() => { loadingContainer.remove(); }, 400);
	}).catch((err) => {
		loadingText.innerText = "An execution setup layout error has occurred.";
		loadingText.style.color = "#ff4a4a";
		console.error(err);
	});
</script>
</body>
</html>
