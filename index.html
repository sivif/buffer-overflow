<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Buffer Overflow</title>
	<style>
		/* 🛠️ 1. BASE CANVAS STYLING & SLEEK BLACK BACKGROUND */
		body {
			margin: 0;
			padding: 0;
			background-color: #0d0d11;
			color: #ffffff;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
			position: absolute;
			top: 0;
			left: 0;
			z-index: 1;
		}

		#canvas:focus {
			outline: none;
		}

		/* 🛠️ 2. CUSTOM LOADING OVERLAY CONTAINER */
		#loading-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: #09090b; /* Pure velvet black boot overlay */
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			z-index: 10;
			transition: opacity 0.4s ease-out;
		}

		/* 🛠️ 3. LOADING TRACKER WITH PROGRESS-TRACKING GIF */
		.loader-wrapper {
			position: relative;
			width: 280px;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
		}

		/* THE PROGRESS GIF CONTAINER */
		#loading-gif {
			width: 32px;
			height: 38px;
			position: absolute;
			bottom: 16px; /* Sits cleanly on top of the loading bar */
			left: 0%;    
			transform: translateX(-50%); /* Centers the asset exactly on the progress line */
			image-rendering: pixelated; /* Keeps pixel-art loops super crisp */
			pointer-events: none;
		}

		/* THE SLEEK CUSTOM METRIC PROGRESS BAR */
		progress {
			-webkit-appearance: none;
			appearance: none;
			width: 100%;
			height: 6px; /* Thin, minimalist profile bar design */
			border: none;
			background-color: #1c1c24; /* Loading bar track gutter background */
			border-radius: 10px;
			overflow: visible;
		}

		progress::-webkit-progress-bar {
			background-color: #1c1c24;
			border-radius: 10px;
		}
		progress::-webkit-progress-value {
			background-color: #ff4a4a; /* Sleek arcade accent tracking line (Neon Red) */
			border-radius: 10px;
			transition: width 0.1s ease-out;
		}

		progress::-moz-progress-bar {
			background-color: #ff4a4a;
			border-radius: 10px;
		}

		#loading-text {
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: 0.15em;
			color: #636370;
			margin-top: 12px;
			align-self: center;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">HTML5 canvas interface support is required to run this execution application.</canvas>

	<div id="loading-container">
		<div class="loader-wrapper">
			<img id="loading-runner" src="loading_runner.gif" alt="Loading..." style="display: none; position: absolute; bottom: 16px; left: 0%; transform: translateX(-50%); width: 48px; height: 48px; image-rendering: pixelated;" />
			
			<progress id="progress" value="0" max="100"></progress>
			<div id="loading-text">Initializing Engine...</div>
		</div>
	</div>

	<script src="index.js"></script>
	<script>
		// 🟢 Godot 4.3+ Official Engine Instantiation Standard
		const loadingContainer = document.getElementById('loading-container');
		const progressBar = document.getElementById('progress');
		const loadingText = document.getElementById('loading-text');
		const loadingGif = document.getElementById('loading-runner');

		// Create instance passing the configuration dictionary token injected by Godot
		createGodotInstance({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4791920,"index.wasm":35754592},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4}).then((instance) => {
			// Show the runner GIF as soon as data packets stream in
			if (loadingGif) loadingGif.style.display = 'block';

			// Bind the tracking hooks to the standard data stream
			instance.onProgress = function (current, total) {
				if (total > 0) {
					const percentage = (current / total) * 100;
					progressBar.value = percentage;
					loadingText.innerText = `Downloading Data: ${Math.floor(percentage)}%`;
					
					if (loadingGif) {
						loadingGif.style.left = `${percentage}%`;
					}
				} else {
					loadingText.innerText = "Processing system segments...";
				}
			};

			// Run the compiled binary execution loops
			return instance.run();
		}).then(() => {
			// Handle sleek fade-out sequence once active loops begin
			loadingContainer.style.opacity = '0';
			setTimeout(() => {
				loadingContainer.remove();
			}, 400);
		}).catch((err) => {
			loadingText.innerText = "An execution setup layout error has occurred.";
			loadingText.style.color = "#ff4a4a";
			console.error(err);
		});
	</script>
</body>
</html>
