<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Buffer Overflow</title>
		<style>
			/* 🛠️ 1. SLEEK BLACK CANVAS STYLING */
			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
			}

			body {
				color: white;
				background-color: #0d0d11; /* Clean dark-space theme */
				overflow: hidden;
				touch-action: none;
				font-family: system-ui, -apple-system, sans-serif;
			}

			#canvas {
				display: block;
			}

			#canvas:focus {
				outline: none;
			}

			/* 🛠️ 2. VELVET BLACK OVERLAY COVER */
			#status {
				position: absolute;
				left: 0;
				right: 0;
				top: 0;
				bottom: 0;
				background-color: #09090b; /* True velvet deep black */
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 10;
			}

			/* 🛠️ 3. LOADING TRACKER BOX SETUP */
			.loader-wrapper {
				position: relative;
				width: 280px; /* Locked explicit layout dimension boundary */
				display: flex;
				flex-direction: column;
				align-items: flex-start;
			}

			/* THE TRACKING GIF LAYOUT CONFIGURATION */
			#status-gif {
				width: 32px;  /* Adjust sizes to match your specific GIF dimension rules */
				height: 38px;
				position: absolute;
				bottom: 32px; /* Sits neatly immediately above the thin progress line */
				left: 0%;    /* Modified live via the JS event function below */
				transform: translateX(-50%); /* Centers anchor layout on top of the percentage line */
				image-rendering: pixelated; /* Keeps pixel-art lines sharp and clean */
				pointer-events: none;
				display: none; /* Appears smoothly once data bytes begin flowing */
			}

			/* THE SLEEK SLIM MINIMALIST PROGRESS BAR */
			#status-progress {
				-webkit-appearance: none;
				appearance: none;
				width: 100%;
				height: 6px; /* Thin modern visual design profile */
				border: none;
				background-color: #1c1c24; /* Background slot gutter color */
				border-radius: 10px;
				overflow: visible; /* Allows the runner GIF to shift smoothly */
			}

			#status-progress::-webkit-progress-bar {
				background-color: #1c1c24;
				border-radius: 10px;
			}
			#status-progress::-webkit-progress-value {
				background-color: #ff4a4a; /* Sleek Neon Arcade Red color bar line */
				border-radius: 10px;
				transition: width 0.1s ease-out;
			}
			#status-progress::-moz-progress-bar {
				background-color: #ff4a4a;
				border-radius: 10px;
			}

			#loading-text {
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.15em;
				color: #636370;
				margin-top: 12px;
				align-self: center;
			}

			/* Error Handling Box Message */
			#status-notice {
				background-color: #5b3943;
				border-radius: 0.5rem;
				border: 1px solid #9b3943;
				color: #e0e0e0;
				line-height: 1.3;
				margin: 2rem auto;
				padding: 1rem;
				text-align: center;
				display: none;
				max-width: 400px;
			}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Buffer Overflow.icon.png" />
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div class="loader-wrapper">
				<img id="status-gif" src="loading_runner.gif" alt="Loading..." />
				
				<progress id="status-progress" value="0" max="100"></progress>
				<div id="loading-text">Initializing Engine...</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":4792096,"index.wasm":35754592},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

// 🟢 Uses the exact Engine instance standard provided by your original setup
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingText = document.getElementById('loading-text');
	const statusGif = document.getElementById('status-gif');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (statusGif) statusGif.style.display = mode === 'progress' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		if (loadingText) loadingText.style.display = 'none';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		
		// 🛠️ Bind tracking math to the active startGame hook
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const percentage = (current / total) * 100;
					
					statusProgress.value = current;
					statusProgress.max = total;
					
					if (loadingText) {
						loadingText.innerText = `Downloading Data: ${Math.floor(percentage)}%`;
					}
					
					// ✨ Moves your GIF along the X-Axis boundary line matching asset progress!
					if (statusGif) {
						statusGif.style.left = `${percentage}%`;
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					if (loadingText) loadingText.innerText = "Processing systems...";
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
