<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Buffer Overflow</title>
		<style>
			@font-face {
				font-family: 'BoldPixels';
				src: url('BoldPixels.ttf') format('truetype');
				font-display: swap;
			}

			:root {
				--bg-void:     #000000;
				--white:       #f5f5f5;
				--glow:        rgba(255,255,255,0.85);
				--tick:        #35d1ff;
				--text-dim:    #9a9a9a;
				--err-bg:      #1a1a1a;
				--err-border:  #f5f5f5;
				--font-pixel: 'BoldPixels', 'Press Start 2P', ui-monospace, monospace;
			}

			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
			}

			body {
				color: var(--white);
				background-color: var(--bg-void);
				overflow: hidden;
				touch-action: none;
				font-family: var(--font-pixel);
			}

			#canvas {
				display: block;
			}

			#canvas:focus {
				outline: none;
			}

			#status {
				position: absolute;
				left: 0;
				right: 0;
				top: 0;
				bottom: 0;
				background-color: var(--bg-void);
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				z-index: 10;
			}

			.loader-wrapper {
				position: relative;
				width: min(360px, 80vw);
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			/* The character gif that walks along the top of the bar */
			#status-gif {
				position: absolute;
				bottom: 24px;
				left: 0%;
				width: 32px;
				height: 38px;
				transform: translateX(-50%);
				image-rendering: pixelated;
				pointer-events: none;
				display: none;
			}

			#loading-text {
				font-family: var(--font-pixel);
				font-size: 13px;
				letter-spacing: 0.35em;
				text-transform: uppercase;
				color: var(--white);
				text-shadow: 0 0 6px var(--glow), 0 0 14px rgba(255,255,255,0.4);
				margin-bottom: 14px;
			}

			.bar-frame {
				position: relative;
				width: 100%;
				height: 22px;
				box-sizing: border-box;
				border: 2px solid var(--white);
				padding: 4px;
				box-shadow:
					0 0 4px rgba(255,255,255,0.7),
					0 0 12px rgba(255,255,255,0.25),
					inset 0 0 4px rgba(255,255,255,0.15);
			}

			#status-progress {
				-webkit-appearance: none;
				appearance: none;
				display: block;
				width: 100%;
				height: 100%;
				border: none;
				background-color: transparent;
			}

			#status-progress::-webkit-progress-bar {
				background-color: transparent;
			}
			#status-progress::-webkit-progress-value {
				background-color: var(--white);
				box-shadow: 0 0 8px 2px var(--glow), 0 0 18px 4px rgba(255,255,255,0.45);
				transition: width 0.15s ease-out;
			}
			#status-progress::-moz-progress-bar {
				background-color: var(--white);
				box-shadow: 0 0 8px 2px var(--glow), 0 0 18px 4px rgba(255,255,255,0.45);
				transition: width 0.15s ease-out;
			}

			/* Bright accent tick riding the leading edge of the fill */
			#bar-tick {
				position: absolute;
				top: 4px;
				bottom: 4px;
				width: 4px;
				left: 2%;
				background-color: var(--tick);
				box-shadow: 0 0 6px 2px var(--tick), 0 0 14px 4px rgba(53,209,255,0.6);
				transform: translateX(-100%);
				transition: left 0.15s ease-out;
				pointer-events: none;
			}

			#status-notice {
				background-color: var(--err-bg);
				border-radius: 2px;
				border: 1px solid var(--err-border);
				color: var(--white);
				font-family: var(--font-pixel);
				font-size: 11px;
				line-height: 1.6;
				margin: 2rem auto 0;
				padding: 1rem 1.1rem;
				text-align: left;
				display: none;
				max-width: 380px;
			}

			@media (prefers-reduced-motion: reduce) {
				#status-progress::-webkit-progress-value,
				#status-progress::-moz-progress-bar,
				#bar-tick {
					transition: none;
				}
			}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="Buffer Overflow.icon.png" />
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div class="loader-wrapper">
				<img id="status-gif" src="loading_runner.gif" alt="Loading..." />
				<div id="loading-text">Loading...</div>
				<div class="bar-frame">
					<progress id="status-progress" value="0" max="100"></progress>
					<div id="bar-tick"></div>
				</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":23504484,"index.wasm":35754592},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingText = document.getElementById('loading-text');
	const statusGif = document.getElementById('status-gif');
	const barTick = document.getElementById('bar-tick');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (statusGif) statusGif.style.display = mode === 'progress' ? 'block' : 'none';
		if (barTick) barTick.style.display = mode === 'progress' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		if (loadingText) loadingText.style.display = 'none';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');

		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const percentage = (current / total) * 100;

					statusProgress.value = current;
					statusProgress.max = total;

					if (loadingText) {
						loadingText.innerText = `Loading... ${Math.floor(percentage)}%`;
					}

					// Move the runner gif and the accent tick along the bar to match progress
					if (statusGif) statusGif.style.left = `${percentage}%`;
					if (barTick) barTick.style.left = `${percentage}%`;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					if (loadingText) loadingText.innerText = 'Loading...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
